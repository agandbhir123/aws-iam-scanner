name: IAM Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"   # Every Monday at 9:00 AM UTC

  workflow_dispatch:        # Manual trigger from the Actions tab
    inputs:
      days:
        description: "Threshold in days for stale keys/roles (default: 90)"
        default: "90"
        type: string
      skip:
        description: "Checks to skip — space-separated (wildcard keys attachments trust roles mfa s3)"
        default: ""
        type: string

  push:
    branches: [main]        # Also run on every push to main

jobs:
  scan:
    name: Scan AWS account
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write         # Required to open / update findings issues

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Run scanner ────────────────────────────────────────────────────────
      # Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in your repo's
      # Settings → Secrets and variables → Actions → Repository secrets.
      #
      # For better security (no long-lived keys), configure OIDC:
      # https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
      - name: Run IAM scanner
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          SKIP_ARG=""
          if [ -n "${{ inputs.skip }}" ]; then
            SKIP_ARG="--skip ${{ inputs.skip }}"
          fi

          python -m scanner \
            --output iam_scan_report.json \
            --days "${{ inputs.days || '90' }}" \
            $SKIP_ARG

      # ── Persist report ─────────────────────────────────────────────────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iam-scan-${{ github.run_number }}
          path: iam_scan_report.json
          retention-days: 90

      # ── Write GitHub job summary ───────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: python scripts/summarize.py iam_scan_report.json

      # ── Open or update a GitHub Issue for HIGH findings ────────────────────
      - name: Create or update findings issue
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: iam_scan_report.json
        with:
          script: |
            const fs   = require("fs");
            const path = process.env.REPORT_PATH;

            if (!fs.existsSync(path)) {
              core.warning("Report file not found — skipping issue step.");
              return;
            }

            const report  = JSON.parse(fs.readFileSync(path, "utf8"));
            const { grade, score, summary, findings } = report;
            const highFindings = findings.filter(f => f.severity === "HIGH");

            if (highFindings.length === 0) {
              core.info("No HIGH findings — skipping issue creation.");
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date   = new Date().toISOString().split("T")[0];
            const gradeEmoji = { A: "🟢", B: "🟢", C: "🟡", D: "🟠", F: "🔴" }[grade] ?? "⚪";

            const findingRows = highFindings.map(f => [
              `- **${f.resource_type}** \`${f.resource_name}\``,
              `  - ${f.issues[0]}`,
              `  - *Fix:* ${f.remediation}`,
            ].join("\n")).join("\n");

            const body = [
              `## ${gradeEmoji} IAM Security Scan — Grade **${grade}** (score ${score})`,
              "",
              `> Scan run: [${date} #${context.runNumber}](${runUrl})`,
              "",
              "| Severity | Count |",
              "|---|---|",
              `| 🔴 HIGH | ${summary.high} |`,
              `| 🟡 MEDIUM | ${summary.medium} |`,
              `| 🔵 LOW | ${summary.low} |`,
              `| **Total** | **${summary.total}** |`,
              "",
              "### 🔴 HIGH Findings — requires immediate action",
              "",
              findingRows,
              "",
              "---",
              `_Auto-generated by [IAM Scanner](${ context.serverUrl }/${ context.repo.owner }/${ context.repo.repo }). Download the [full JSON report](${runUrl}) for all findings and remediation steps._`,
            ].join("\n");

            const title = `IAM Security Findings — Grade ${grade} — ${date}`;

            // Check for an existing open scanner issue
            const { data: existing } = await github.rest.issues.listForRepo({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              state:  "open",
              labels: "iam-scanner",
            });

            if (existing.length > 0) {
              const issue = existing[0];
              await github.rest.issues.update({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                title,
                body,
              });
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                body: `🔄 Updated by scan [#${context.runNumber}](${runUrl}) on ${date} — **${summary.high} HIGH** finding(s)`,
              });
              core.info(`Updated existing issue #${issue.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title,
                body,
                labels: ["iam-scanner", "security"],
              });
              core.info(`Opened new issue #${issue.number}`);
            }
